<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>论文精读 · Xuext</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="vendor/hljs-light.min.css" id="hljs-light">
  <link rel="stylesheet" href="vendor/hljs-dark.min.css" id="hljs-dark" disabled>
  <link rel="stylesheet" href="styles.css">

<style>
  #topEditorBar, #saveIndicator, #openFolderBtn, #pickFolderBtn, #pickFilesBtn,
  #commentPanel { display: none !important; }
  .vault-path-badge { cursor: default !important; }
  .back-home { display: inline-block; margin: 6px 0 2px; font-size: 13px; color: #2563eb; text-decoration: none; }
  .back-home:hover { text-decoration: underline; }
</style>
<script>window.READER_READONLY = true;</script>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand-bar">
      <div class="brand-top">
        <div class="brand-title"><span class="brand-icon">∑</span><span id="vaultName">知识库</span></div>
        <div class="brand-actions">
          <button class="btn btn-icon" id="themeBtn" title="切换深浅色">🌓</button>
          <button class="btn" id="sidebarCollapseBtn" title="收起左侧列表" aria-label="收起左侧列表" aria-controls="sidebar">收起</button>
        </div>
      </div>
      <a class="back-home" href="/">← 返回博客首页</a>
      <div class="vault-path-badge" id="vaultPath" title="">-</div>
      <div class="action-row">
        <button class="btn btn-primary" id="pickFolderBtn" style="flex:1">📂 读入本地文件夹</button>
        <button class="btn" id="pickFilesBtn" title="读入单个或多个 md 文件">📄 md</button>
        <button class="btn btn-icon" id="resetBtn" title="恢复默认知识库">↺</button>
      </div>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <input type="file" id="filesInput" accept=".md,.markdown,text/markdown" multiple hidden>
    </div>

    <div class="search-box">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" type="text" placeholder="搜索标题 / 路径 / 标签，回车全文搜索">
        <button class="search-clear" id="searchClear">✕</button>
      </div>
      <div class="tree-toolbar">
        <span class="tree-stat" id="treeStat">-</span>
        <div class="tree-toolbar-actions">
          <button class="link-btn" id="expandAllBtn">展开</button>
          <button class="link-btn" id="collapseAllBtn">折叠</button>
          <button class="link-btn active" id="hideAssetBtn" title="隐藏 assets 附件目录里的辅助文档">隐藏附件文档</button>
        </div>
      </div>
    </div>

    <div class="tree-container" id="tree"></div>
  </aside>

  <main class="main-pane">
    <header class="top-header">
      <div class="header-left">
        <button class="btn btn-icon" id="sidebarBtn" title="收起左侧列表" aria-label="收起左侧列表" aria-controls="sidebar" aria-expanded="true">☰</button>
        <div class="breadcrumbs" id="breadcrumbs"></div>
      </div>

      <!-- 固定在页面顶部的快捷编辑工具栏 -->
      <div class="top-editor-bar" id="topEditorBar">
        <button class="sel-btn sel-btn-bold" id="selBoldBtn" title="加粗选中文字 (** **) · 快捷键 ⌘B">
          <b>B</b><span>加粗</span><kbd class="kbd-hint">⌘B</kbd>
        </button>
        <span class="sel-divider"></span>
        <div class="sel-colors" id="selColors" title="设置文字颜色 · 快捷键 Option + 1~6 (⌥1~⌥6)">
          <button class="color-dot" data-color="red" style="background:#ef4444" title="红色 (red) · 快捷键 ⌥1"><span>1</span></button>
          <button class="color-dot" data-color="#e67e22" style="background:#e67e22" title="橙色 (#e67e22) · 快捷键 ⌥2"><span>2</span></button>
          <button class="color-dot" data-color="#d97706" style="background:#d97706" title="琥珀色 (#d97706) · 快捷键 ⌥3"><span>3</span></button>
          <button class="color-dot" data-color="#16a34a" style="background:#16a34a" title="绿色 (#16a34a) · 快捷键 ⌥4"><span>4</span></button>
          <button class="color-dot" data-color="#2563eb" style="background:#2563eb" title="蓝色 (#2563eb) · 快捷键 ⌥5"><span>5</span></button>
          <button class="color-dot" data-color="#9333ea" style="background:#9333ea" title="紫色 (#9333ea) · 快捷键 ⌥6"><span>6</span></button>
        </div>
        <button class="sel-btn" id="selClearColorBtn" title="取消选中文字颜色 · 快捷键 ⌥0 或 ⌘⇧X">
          🚫<span>取消色</span><kbd class="kbd-hint">⌥0</kbd>
        </button>
        <span class="sel-divider"></span>
        <button class="sel-btn sel-btn-comment" id="selCommentBtn" title="对选中文字添加批注评论 · 快捷键 ⌘M (或 ⌘⇧M)">
          ➕<span>评论</span><kbd class="kbd-hint">⌘M</kbd>
        </button>
        <button class="sel-btn sel-btn-edit" id="selBlockEditBtn" title="原位编辑鼠标所在段落（保持渲染效果，仅加边框直接改字，按 ⌘Enter 或失焦保存） · 快捷键 ⌘E">
          ✏️<span>段落编辑</span><kbd class="kbd-hint">⌘E</kbd>
        </button>
        <button class="sel-btn sel-btn-img" id="selInsertImgBtn" title="在当前段落或位置插入图片（支持剪贴板粘贴 ⌘V、拖拽或选择文件，自动存入对应 assets 文件夹并写入原文件） · 快捷键 ⌘I">
          🖼️<span>插图</span><kbd class="kbd-hint">⌘I</kbd>
        </button>
        <span class="sel-divider"></span>
        <button class="sel-btn" id="headerUndoBtn" disabled title="撤销上一步对原文档的修改 · 快捷键 ⌘Z">
          ↩<span>撤销</span><kbd class="kbd-hint">⌘Z</kbd>
        </button>
        <span class="sel-divider"></span>
        <span class="save-indicator" id="saveIndicator" role="status" aria-live="polite" title="编辑会实时写入原文件">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle class="si-track" cx="12" cy="12" r="9.5"></circle>
            <circle class="si-ring" cx="12" cy="12" r="9.5"></circle>
            <path class="si-check" d="M7.6 12.6l3 3 5.8-6.4"></path>
            <path class="si-warn" d="M12 7.2v5.6M12 16.4v.1"></path>
          </svg>
        </span>

        <!-- 顶部工具栏下方的评论下拉面板 -->
        <div class="comment-dropdown hidden" id="commentPanel">
          <div class="comment-quote-preview" id="commentQuotePreview">请先选中正文中的文字</div>
          <textarea class="comment-textarea" id="commentInput" rows="2" placeholder="输入批注评论（将高亮选中文字并在该段下方插入 > 引用块，按 ⌘+Enter 写入原文档）"></textarea>
          <div class="comment-actions">
            <button class="btn" id="commentCancelBtn">取消 (Esc)</button>
            <button class="btn btn-primary" id="commentSubmitBtn">💬 写入原文档 (⌘↵)</button>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button class="btn" id="openFolderBtn" title="在 Finder 中打开当前文档所在的源文件夹（未打开文档时打开知识库根目录）">📂 源文件夹</button>
        <div class="header-stats-wrap" id="headerStats"></div>
      </div>
    </header>

    <div class="content-workspace">
      <div class="article-scroll" id="articleScroll">
        <div class="article-container" id="article"></div>
      </div>
      <aside class="toc-pane hidden" id="tocPane">
        <div class="toc-header"><span>目录</span></div>
        <ul class="toc-list" id="tocList"></ul>
      </aside>
    </div>
  </main>
</div>

<!-- 实时回写状态轻提示 -->
<div class="toast-notice" id="toastNotice"></div>

<!-- 隐藏文件选择器：供替换图片与插入图片使用 -->
<input type="file" id="imgReplaceFileInput" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml" hidden>
<input type="file" id="imgInsertFileInput" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml" hidden>

<!-- 原地裁剪图片弹窗 (In-place Image Cropper Modal) -->
<div class="img-modal-backdrop hidden" id="cropModal">
  <div class="img-modal-card img-crop-card" role="dialog" aria-modal="true" aria-labelledby="cropModalTitle">
    <div class="img-modal-header">
      <div class="img-modal-title-wrap">
        <span class="img-modal-title" id="cropModalTitle">✂️ 原地裁剪图片</span>
        <span class="img-modal-subpath" id="cropModalPath"></span>
      </div>
      <div class="img-crop-dim-badge" id="cropDimBadge">拖动选框调整裁剪区域</div>
    </div>
    <div class="img-crop-stage" id="cropStage">
      <div class="img-crop-canvas-wrap" id="cropCanvasWrap">
        <img id="cropSourceImg" alt="待裁剪原图" draggable="false">
        <div class="img-crop-box" id="cropBox">
          <span class="crop-handle nw" data-handle="nw"></span>
          <span class="crop-handle n" data-handle="n"></span>
          <span class="crop-handle ne" data-handle="ne"></span>
          <span class="crop-handle e" data-handle="e"></span>
          <span class="crop-handle se" data-handle="se"></span>
          <span class="crop-handle s" data-handle="s"></span>
          <span class="crop-handle sw" data-handle="sw"></span>
          <span class="crop-handle w" data-handle="w"></span>
        </div>
      </div>
    </div>
    <div class="img-modal-footer">
      <div class="img-modal-left-actions">
        <button class="btn" id="cropResetBoxBtn" title="恢复全图选框">全选整图</button>
      </div>
      <div class="img-modal-right-actions">
        <button class="btn" id="cropCancelBtn">取消 (Esc)</button>
        <button class="btn btn-primary" id="cropConfirmBtn">💾 覆盖保存到原图文件 (⌘↵)</button>
      </div>
    </div>
  </div>
</div>

<!-- 替换 / 插入图片弹窗（支持直接按 Cmd+V 粘贴剪贴板图片、拖拽图片或选择本地图片） -->
<div class="img-modal-backdrop hidden" id="imgPickerModal">
  <div class="img-modal-card img-picker-card" role="dialog" aria-modal="true" aria-labelledby="imgPickerTitle">
    <div class="img-modal-header">
      <div class="img-modal-title-wrap">
        <span class="img-modal-title" id="imgPickerTitle">🖼️ 插入 / 替换图片</span>
        <span class="img-modal-subpath" id="imgPickerSub"></span>
      </div>
    </div>
    <div class="img-picker-body">
      <div class="img-dropzone" id="imgDropzone" tabindex="0">
        <div class="img-dropzone-empty" id="imgDropzoneEmpty">
          <div class="img-dropzone-icon">📋 / 📁</div>
          <div class="img-dropzone-main">直接按 <kbd>⌘V</kbd> 粘贴剪贴板图片，或拖拽图片到此处</div>
          <div class="img-dropzone-sub">也可以点击下方按钮从本地电脑选择图片文件</div>
          <div class="img-dropzone-btns">
            <button class="btn btn-primary" type="button" id="imgReadClipboardBtn">📋 读取剪贴板图片</button>
            <button class="btn" type="button" id="imgBrowseLocalBtn">📂 选择本地图片文件…</button>
          </div>
        </div>
        <div class="img-dropzone-preview hidden" id="imgDropzonePreview">
          <img id="imgPickerPreviewImg" alt="预览图片">
          <div class="img-preview-meta" id="imgPickerPreviewMeta"></div>
          <button class="btn" type="button" id="imgClearPreviewBtn">重新选择 / 重新粘贴</button>
        </div>
      </div>
      <div class="img-insert-options" id="imgInsertOptions">
        <div class="img-option-row">
          <label for="imgAltInput">图片说明 (Alt)：</label>
          <input type="text" id="imgAltInput" class="search-input" placeholder="可选，例如：图 1 整体架构图">
        </div>
        <div class="img-option-row">
          <label for="imgPositionSelect">插入位置：</label>
          <select id="imgPositionSelect" class="search-input">
            <option value="after">当前选中/悬停段落的下方（推荐）</option>
            <option value="before">当前选中/悬停段落的上方</option>
            <option value="end">文档末尾</option>
          </select>
        </div>
      </div>
    </div>
    <div class="img-modal-footer">
      <div class="img-modal-left-actions">
        <span class="img-picker-hint" id="imgPickerHint">图片将直接写入原文件夹</span>
      </div>
      <div class="img-modal-right-actions">
        <button class="btn" id="imgPickerCancelBtn">取消 (Esc)</button>
        <button class="btn btn-primary" id="imgPickerConfirmBtn" disabled>💾 确认写入原文件 (⌘↵)</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="render.js"></script>
<script src="editor.js"></script>
<script src="vault-manifest.js"></script>
<script src="vault-docs.js" onerror="window.OBSIDIAN_VAULT_DOCS=null"></script>
<script src="app.js"></script>
</body>
</html>
