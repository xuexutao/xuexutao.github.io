<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .subtitle{font:500 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526076}
      .lane{font:700 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26354f}
      .nodeTitle{font:700 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#14213d}
      .nodeText{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#45536a}
      .year{font:700 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#7b4f00}
      .arrow{stroke:#61708a;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#9ba8bc;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#61708a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2a44" flood-opacity="0.12"/></filter>
  </defs>
  <rect x="0" y="0" width="1600" height="920" rx="24" fill="#f7f9fc"/>
  <text x="70" y="62" class="title">Video Distillation 技术演进：两条基础线，四类 2026 前沿</text>
  <text x="70" y="96" class="subtitle">蒸馏目标、因果序列训练、初始化、on-policy rollout、长程记忆与质量监督并非同一问题</text>

  <rect x="55" y="130" width="1490" height="168" rx="22" fill="#edf3ff" stroke="#c7d8f7"/>
  <text x="78" y="165" class="lane">基础层：两套互补工具箱</text>
  <g filter="url(#shadow)">
    <rect x="100" y="190" width="355" height="82" rx="16" fill="#ffffff" stroke="#7da5e7" stroke-width="2"/>
    <text x="122" y="220" class="nodeTitle">DMD</text><text x="122" y="246" class="nodeText">匹配输出分布：real score − fake score</text><text x="393" y="219" class="year">2023/24</text>
    <rect x="570" y="190" width="405" height="82" rx="16" fill="#ffffff" stroke="#5fb6a5" stroke-width="2"/>
    <text x="592" y="220" class="nodeTitle">Diffusion Forcing</text><text x="592" y="246" class="nodeText">每个时序 token 独立噪声，统一 AR 与扩散</text><text x="911" y="219" class="year">2024</text>
    <rect x="1090" y="190" width="380" height="82" rx="16" fill="#ffffff" stroke="#d19a55" stroke-width="2"/>
    <text x="1112" y="220" class="nodeTitle">一致性 / 轨迹蒸馏</text><text x="1112" y="246" class="nodeText">学习 ODE flow map 或跨步 endpoint 一致性</text><text x="1408" y="219" class="year">基础线</text>
  </g>

  <rect x="55" y="324" width="1490" height="225" rx="22" fill="#f4efff" stroke="#d8c8f5"/>
  <text x="78" y="360" class="lane">因果视频主线：从结构转换到训练—推理对齐</text>
  <g filter="url(#shadow)">
    <rect x="90" y="395" width="265" height="112" rx="16" fill="#ffffff" stroke="#9c7bd6" stroke-width="2"/>
    <text x="112" y="425" class="nodeTitle">CausVid</text><text x="112" y="451" class="nodeText">双向教师 → 因果学生</text><text x="112" y="476" class="nodeText">ODE 初始化 + asymmetric DMD</text><text x="295" y="425" class="year">2024</text>
    <rect x="425" y="395" width="270" height="112" rx="16" fill="#ffffff" stroke="#9c7bd6" stroke-width="2"/>
    <text x="447" y="425" class="nodeTitle">Self Forcing</text><text x="447" y="451" class="nodeText">训练时执行学生 self-rollout</text><text x="447" y="476" class="nodeText">修复 history distribution gap</text><text x="635" y="425" class="year">2025</text>
    <rect x="765" y="395" width="275" height="112" rx="16" fill="#ffffff" stroke="#9c7bd6" stroke-width="2"/>
    <text x="787" y="425" class="nodeTitle">Causal Forcing</text><text x="787" y="451" class="nodeText">指出双向 ODE 目标非单值</text><text x="787" y="476" class="nodeText">改用 AR teacher 做 causal ODE</text><text x="982" y="425" class="year">2026</text>
    <rect x="1110" y="378" width="350" height="70" rx="16" fill="#ffffff" stroke="#9c7bd6" stroke-width="2"/>
    <text x="1132" y="408" class="nodeTitle">Causal Forcing++</text><text x="1132" y="433" class="nodeText">causal CD：在线一步教师，替代完整轨迹库</text>
    <rect x="1110" y="465" width="350" height="70" rx="16" fill="#ffffff" stroke="#9c7bd6" stroke-width="2"/>
    <text x="1132" y="495" class="nodeTitle">Self-Forcing++</text><text x="1132" y="520" class="nodeText">extended DMD：把短教师用于长 rollout 局部纠错</text>
  </g>
  <path d="M355 451 L425 451" class="arrow"/><path d="M695 451 L765 451" class="arrow"/><path d="M1040 426 L1110 413" class="arrow"/><path d="M695 476 C860 550 980 525 1110 500" class="dash"/>
  <path d="M275 272 C235 315 220 350 220 395" class="arrow"/><path d="M760 272 C650 320 580 350 560 395" class="arrow"/><path d="M1280 272 C1180 330 1040 360 920 395" class="dash"/>

  <rect x="55" y="575" width="1490" height="286" rx="22" fill="#eef8f3" stroke="#c0e0d0"/>
  <text x="78" y="611" class="lane">2026 前沿：围绕 DMD 的四类缺口分叉</text>
  <g filter="url(#shadow)">
    <rect x="85" y="646" width="335" height="170" rx="18" fill="#ffffff" stroke="#5aa88a" stroke-width="2"/>
    <text x="108" y="680" class="nodeTitle">A. 少步初始化与目标组合</text>
    <text x="108" y="711" class="nodeText">Causal-rCM：TF-CM + SF-DMD</text>
    <text x="108" y="739" class="nodeText">One-Forcing：DMD + GAN，一步生成</text>
    <text x="108" y="767" class="nodeText">PTD：参数化轨迹，DMD 之外的替代线</text>
    <text x="108" y="795" class="nodeText">关键问句：一步跳跃如何仍保运动与结构？</text>

    <rect x="452" y="646" width="335" height="170" rx="18" fill="#ffffff" stroke="#5aa88a" stroke-width="2"/>
    <text x="475" y="680" class="nodeTitle">B. 质量信号与教师上限</text>
    <text x="475" y="711" class="nodeText">Reward / Data Forcing：奖励与真实样本</text>
    <text x="475" y="739" class="nodeText">DuoMatching：视频 joint + 图像 marginal</text>
    <text x="475" y="767" class="nodeText">SF²：输出分布 + 内部表征</text>
    <text x="475" y="795" class="nodeText">关键问句：教师分布之外，质量从哪里来？</text>

    <rect x="819" y="646" width="335" height="170" rx="18" fill="#ffffff" stroke="#5aa88a" stroke-width="2"/>
    <text x="842" y="680" class="nodeTitle">C. 估计器与跨块信用</text>
    <text x="842" y="711" class="nodeText">DMAD：密度比分类取代 fake score diffusion</text>
    <text x="842" y="739" class="nodeText">Leta：ScoreDelta + FutureCredit</text>
    <text x="842" y="767" class="nodeText">SGF / SGF+：KV 写入梯度与角色解耦</text>
    <text x="842" y="795" class="nodeText">关键问句：梯度是否到达真正导致未来误差的地方？</text>

    <rect x="1186" y="646" width="285" height="170" rx="18" fill="#ffffff" stroke="#5aa88a" stroke-width="2"/>
    <text x="1209" y="680" class="nodeTitle">D. 系统与长记忆</text>
    <text x="1209" y="711" class="nodeText">Sparse Forcing</text>
    <text x="1209" y="739" class="nodeText">持久块 + 动态局部稀疏</text>
    <text x="1209" y="767" class="nodeText">PBSA 定制 kernel</text>
    <text x="1209" y="795" class="nodeText">关键问句：哪些历史值得被保留？</text>
  </g>
  <path d="M1290 535 C1250 585 1210 610 1330 646" class="dash"/>
  <path d="M560 507 C540 585 560 610 620 646" class="dash"/>
  <path d="M900 507 C910 585 960 610 987 646" class="dash"/>
  <text x="70" y="892" class="subtitle">综述自绘；依据各论文官方方法与时间线。箭头表示直接继承，虚线表示方法论影响或可组合关系。</text>
</svg>