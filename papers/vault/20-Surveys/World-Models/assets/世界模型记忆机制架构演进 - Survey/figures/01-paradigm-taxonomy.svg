<svg viewBox="0 0 680 376" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>世界模型记忆机制的范式全景图</title>
<desc>展示交互式世界模型与纯视频生成两大元范式，及其共享的六类记忆机制。</desc>
<g>
<rect x="40" y="20" width="600" height="44" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">世界模型的记忆机制（Memory for World Models）</text>
</g>
<g>
<rect x="40" y="86" width="290" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="185" y="106" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">交互式世界模型</text>
<text x="185" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">记忆 = 空间几何「在哪里」</text>
<rect x="350" y="86" width="290" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="495" y="106" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">纯视频生成 / 叙事</text>
<text x="495" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">记忆 = 实体状态「是什么」</text>
</g>
<g>
<rect x="40" y="170" width="188" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="134" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">历史帧·滑动窗口</text>
<text x="134" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Genie2 · Oasis · GAIA</text>
<rect x="246" y="170" width="188" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">显式 3D 几何记忆</text>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">VMem · Spatia · Spmem</text>
<rect x="452" y="170" width="188" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="546" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">外部记忆库 + 检索</text>
<text x="546" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">ContextMem · HyDRA</text>
</g>
<g>
<rect x="40" y="244" width="188" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="134" y="264" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">记忆压缩</text>
<text x="134" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">RELIC · InfWorld · FramePack</text>
<rect x="246" y="244" width="188" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="264" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">循环隐状态记忆</text>
<text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">SSM · LSTM · TTT</text>
<rect x="452" y="244" width="188" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="546" y="264" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">训练对齐 / Forcing</text>
<text x="546" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Diffusion · Context · Self</text>
</g>
<g>
<rect x="40" y="322" width="600" height="36" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">趋势：从「硬记 context」→ 显式几何 + 压缩 + 检索 + 循环隐状态 多元并存</text>
</g>
</svg>
