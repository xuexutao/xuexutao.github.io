<svg viewBox="0 0 680 304" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>三条记忆路线的架构对比</title>
<desc>隐式记忆、显式记忆、混合记忆三条路线在机制、代表方法与代价上的对比。</desc>
<text x="340" y="28" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">三条记忆路线：隐式 vs 显式 vs 混合</text>

<g>
<rect x="40" y="48" width="188" height="236" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="134" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">隐式记忆</text>
<text x="134" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">靠模型内部状态硬记</text>
<line x1="54" y1="112" x2="214" y2="112" stroke="#85B7EB" stroke-width="0.5"/>
<text x="134" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Context window / KV cache</text>
<text x="134" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">循环隐状态 SSM·LSTM·TTT</text>
<line x1="54" y1="176" x2="214" y2="176" stroke="#85B7EB" stroke-width="0.5"/>
<text x="134" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">代表</text>
<text x="134" y="217" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Genie2 · Oasis</text>
<text x="134" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">TTT-Video-DiT</text>
<text x="134" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">无重建误差 · 成本随长度涨</text>
</g>

<g>
<rect x="246" y="48" width="188" height="236" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">显式记忆</text>
<text x="340" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">外部结构化存储 + 检索</text>
<line x1="260" y1="112" x2="420" y2="112" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">3D 几何 点云/surfel/3DGS</text>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">记忆库 帧/特征/实体槽</text>
<line x1="260" y1="176" x2="420" y2="176" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">代表</text>
<text x="340" y="217" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">VMem · Spmem · Spatia</text>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Context-as-Memory · HyDRA</text>
<text x="340" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">有几何锚点 · 动态物体难</text>
</g>

<g>
<rect x="452" y="48" width="188" height="236" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="546" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">混合记忆</text>
<text x="546" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">近期隐式 + 长期显式</text>
<line x1="466" y1="112" x2="626" y2="112" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="546" y="134" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">近期 KV + 压缩长期记忆</text>
<text x="546" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">静态点图 + 稀疏情景帧</text>
<line x1="466" y1="176" x2="626" y2="176" stroke="#AFA9EC" stroke-width="0.5"/>
<text x="546" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">代表</text>
<text x="546" y="217" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">RELIC · MosaicMem</text>
<text x="546" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">HyDRA · Spmem</text>
<text x="546" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">当前主流趋势</text>
</g>
</svg>
